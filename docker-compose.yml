version: '3.8'

services:
  # PostgreSQL Database for Payment Processor
  payment-db:
    image: postgres:15
    environment:
      POSTGRES_DB: payment_processor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - payment_db_data:/var/lib/postgresql/data
      - ./migrations/001_payment_processor_schema.sql:/docker-entrypoint-initdb.d/001_payment_processor_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Database for Reconciliation Service
  reconciliation-db:
    image: postgres:15
    environment:
      POSTGRES_DB: reconciliation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - reconciliation_db_data:/var/lib/postgresql/data
      - ./migrations/002_reconciliation_schema.sql:/docker-entrypoint-initdb.d/002_reconciliation_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and pub/sub
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Payment Processor Service
  payment-processor:
    build:
      context: .
      dockerfile: Dockerfile.payment-processor
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:password@payment-db:5432/payment_processor
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-secret-key-change-in-production
      RUST_LOG: info
    depends_on:
      payment-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Reconciliation Service
  reconciliation-service:
    build:
      context: .
      dockerfile: Dockerfile.reconciliation-service
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: postgresql://postgres:password@reconciliation-db:5432/reconciliation
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-secret-key-change-in-production
      RUST_LOG: info
    depends_on:
      reconciliation-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus for metrics (optional)
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  # Grafana for visualization (optional)
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  payment_db_data:
  reconciliation_db_data:
  redis_data:
  prometheus_data:
  grafana_data:





