version: '3.8'

# Docker Compose Profiles Usage:
# 
# Development (minimal setup):
#   docker-compose up -d
#   This starts: postgres (with all databases) + redis
#
# Services (with applications):
#   docker-compose --profile services up -d
#   This starts: postgres + redis + payment-processor + reconciliation-service
#
# Full Stack (with monitoring):
#   docker-compose --profile services --profile monitoring up -d
#   This starts: everything + prometheus + grafana
#
# Monitoring Only:
#   docker-compose --profile monitoring up -d
#   This starts: prometheus + grafana

services:
  # Single PostgreSQL instance with multiple databases
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: payment_processor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_payment_processor_schema.sql:/docker-entrypoint-initdb.d/001_payment_processor_schema.sql
      - ./migrations/002_reconciliation_schema.sql:/docker-entrypoint-initdb.d/002_reconciliation_schema.sql
      - ./create-databases.sql:/docker-entrypoint-initdb.d/003_create_databases.sql
      - ./monitoring-queries.sql:/docker-entrypoint-initdb.d/004_monitoring_queries.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c log_statement=all
      -c log_duration=on
      -c log_min_duration_statement=1000
      -c log_line_prefix='%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

  # Redis for caching and pub/sub
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Payment Processor Service
  payment-processor:
    build:
      context: .
      dockerfile: Dockerfile.payment-processor
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/payment_processor
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-secret-key-change-in-production
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - services

  # Reconciliation Service
  reconciliation-service:
    build:
      context: .
      dockerfile: Dockerfile.reconciliation-service
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/reconciliation
      STAGING_DATABASE_URL: postgresql://postgres:password@postgres:5432/reconciliation_staging
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-secret-key-change-in-production
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - services


  # Prometheus for metrics (optional)
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    profiles:
      - monitoring

  # Grafana for visualization (optional)
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    profiles:
      - monitoring

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:





